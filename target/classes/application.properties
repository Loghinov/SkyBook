spring.application.name=flight-booking

# H2 in-memory database — replace with real DB config when ready
spring.datasource.url=jdbc:h2:mem:flightdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

jwt.secret=FlightBookingJwtSecretKey2024ThisIsLongEnoughForHS256AlgorithmSecurity!
jwt.expiration=86400000

# ── Amadeus API (https://developers.amadeus.com — free sandbox) ──────────────
# Set enabled=true and add your sandbox credentials to activate live flight search
amadeus.enabled=false
amadeus.client-id=YOUR_API_KEY_HERE
amadeus.client-secret=YOUR_API_SECRET_HERE