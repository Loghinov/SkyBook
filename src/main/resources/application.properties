spring.application.name=flight-booking

# ── Database (PostgreSQL) ────────────────────────────────────────────────────
# Configure via environment variables before running locally or in production:
#   DB_URL      e.g. jdbc:postgresql://localhost:5432/flightdb
#   DB_USERNAME e.g. flight_user
#   DB_PASSWORD e.g. changeme
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── Security ─────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── Amadeus API (optional) ───────────────────────────────────────────────────
amadeus.enabled=false
amadeus.client-id=${AMADEUS_CLIENT_ID:YOUR_API_KEY_HERE}
amadeus.client-secret=${AMADEUS_CLIENT_SECRET:YOUR_API_SECRET_HERE}
