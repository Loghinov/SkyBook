<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkyBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    body { background: #f0f4f8; }
    .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .flight-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.14); transition: box-shadow .15s; }
    #toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; }

    /* ── Navbar brand ───────────────────────────────────────── */
    .navbar-brand {
      font-size: 1.5rem;
      letter-spacing: .5px;
    }
    .navbar { padding-top: .7rem; padding-bottom: .7rem; }

    /* ── Auth screen ────────────────────────────────────────── */
    #screen-auth {
      background: linear-gradient(150deg, #071e3d 0%, #0d2f5e 30%, #1a4a8a 65%, #2471b5 100%);
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* floating cloud blobs */
    .cloud { position:absolute; border-radius:50%; background:rgba(255,255,255,.07); pointer-events:none; }
    .c1 { width:320px;height:120px;top:8%;left:-60px; border-radius:60px; }
    .c2 { width:220px;height:90px; top:18%;right:5%;  border-radius:45px; }
    .c3 { width:260px;height:100px;bottom:20%;left:10%;border-radius:50px; }
    .c4 { width:180px;height:70px; bottom:10%;right:15%;border-radius:35px; }

    /* animated planes */
    @keyframes fly1 { 0%{transform:translateX(-120px) rotate(-8deg);opacity:0} 10%{opacity:.18} 90%{opacity:.18} 100%{transform:translateX(110vw) rotate(-8deg);opacity:0} }
    @keyframes fly2 { 0%{transform:translateX(-80px)  rotate(6deg); opacity:0} 10%{opacity:.12} 90%{opacity:.12} 100%{transform:translateX(110vw)  rotate(6deg); opacity:0} }
    @keyframes fly3 { 0%{transform:translateX(-60px)  rotate(-4deg);opacity:0} 15%{opacity:.1}  85%{opacity:.1}  100%{transform:translateX(110vw)  rotate(-4deg);opacity:0} }

    .plane { position:absolute; pointer-events:none; color:#fff; }
    .p1 { font-size:3.5rem; top:22%; animation: fly1 18s linear infinite; animation-delay:0s; }
    .p2 { font-size:2rem;   top:55%; animation: fly2 24s linear infinite; animation-delay:6s; }
    .p3 { font-size:1.4rem; top:72%; animation: fly3 20s linear infinite; animation-delay:12s; }

    /* star dots */
    #screen-auth::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 15% 25%, rgba(255,255,255,.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 60%, rgba(255,255,255,.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 75%, rgba(255,255,255,.25) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 55% 40%, rgba(255,255,255,.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 80%, rgba(255,255,255,.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 45%, rgba(255,255,255,.25) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 10% 55%, rgba(255,255,255,.3) 0%, transparent 100%);
      pointer-events: none;
    }

    /* ── Login card — frosted glass ─────────────────────────── */
    .auth-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
      color: #fff;
      width: 400px;
      padding: 2.2rem 2.4rem;
    }
    .auth-card .form-control {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      border-radius: 10px;
    }
    .auth-card .form-control::placeholder { color: rgba(255,255,255,0.55); }
    .auth-card .form-control:focus {
      background: rgba(255,255,255,0.25);
      border-color: rgba(255,255,255,0.6);
      color: #fff;
      box-shadow: none;
    }
    .auth-card .form-label { color: rgba(255,255,255,0.85); font-size: .875rem; }
    .auth-card .nav-link { color: rgba(255,255,255,0.65); }
    .auth-card .nav-link.active { color: #fff; border-bottom: 2px solid #fff; background: none; }
    .auth-card .nav-tabs { border-bottom: 1px solid rgba(255,255,255,0.2); }
    .auth-card h4 { color: #fff; }
    .auth-card .text-danger { color: #ffb3b3 !important; }
    .auth-brand-icon { font-size: 2.8rem; opacity: .95; }
  </style>
</head>
<body>

<!-- ── NAVBAR (hidden until logged in) ──────────────────────────────────────── -->
<nav class="navbar navbar-dark bg-primary px-4" id="navbar" style="display:none">
  <span class="navbar-brand fw-bold fs-4"><i class="bi bi-airplane-fill"></i> SkyBook</span>
  <div class="d-flex align-items-center gap-2">
    <span class="text-white small me-1" id="nav-name"></span>
    <span class="badge bg-warning text-dark" id="nav-role" style="display:none">ADMIN</span>
    <button class="btn btn-outline-light btn-sm" onclick="switchTab('profile')" title="My Profile">
      <i class="bi bi-person-circle"></i> Profile
    </button>
    <a href="dashboard.html" class="btn btn-outline-light btn-sm" title="Dashboard">
      <i class="bi bi-house"></i>
    </a>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">
      <i class="bi bi-box-arrow-right"></i> Logout
    </button>
  </div>
</nav>

<!-- ── LOGIN / REGISTER ─────────────────────────────────────────────────────── -->
<div id="screen-auth" class="d-flex align-items-center justify-content-center">
  <!-- decorations -->
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="cloud c4"></div>
  <div class="plane p1"><i class="bi bi-airplane-fill"></i></div>
  <div class="plane p2"><i class="bi bi-airplane-fill"></i></div>
  <div class="plane p3"><i class="bi bi-airplane-fill"></i></div>

  <div class="auth-card" style="position:relative;z-index:2">
    <div class="text-center mb-3">
      <div class="auth-brand-icon"><i class="bi bi-airplane-fill"></i></div>
      <h4 class="fw-bold mt-1 mb-0">SkyBook</h4>
      <div class="text-white-50 small">Your flight booking companion</div>
    </div>

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item">
        <button class="nav-link active" id="btn-login-tab" onclick="authTab('login')">Login</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="btn-reg-tab" onclick="authTab('register')">Register</button>
      </li>
    </ul>

    <!-- Login form -->
    <div id="form-login">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input id="li-user" type="text" class="form-control" placeholder="username"/>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input id="li-pass" type="password" class="form-control" placeholder="••••••••"/>
      </div>
      <button class="btn btn-light w-100 fw-semibold" onclick="doLogin()">Login</button>
      <div id="li-err" class="text-danger small mt-2"></div>
    </div>

    <!-- Register form -->
    <div id="form-reg" style="display:none">
      <div class="row g-2 mb-2">
        <div class="col">
          <label class="form-label">First name</label>
          <input id="rg-first" type="text" class="form-control"/>
        </div>
        <div class="col">
          <label class="form-label">Last name</label>
          <input id="rg-last" type="text" class="form-control"/>
        </div>
      </div>
      <div class="mb-2">
        <label class="form-label">Username</label>
        <input id="rg-user" type="text" class="form-control"/>
      </div>
      <div class="mb-2">
        <label class="form-label">Email</label>
        <input id="rg-email" type="email" class="form-control"/>
      </div>
      <div class="mb-2">
        <label class="form-label">Phone</label>
        <input id="rg-phone" type="text" class="form-control"/>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input id="rg-pass" type="password" class="form-control"/>
      </div>
      <button class="btn btn-light w-100 fw-semibold" onclick="doRegister()">Create account</button>
      <div id="rg-err" class="text-danger small mt-2"></div>
    </div>
  </div>
</div>

<!-- ── MAIN APP (hidden until logged in) ────────────────────────────────────── -->
<div id="screen-app" style="display:none" class="container-fluid py-4">

  <ul class="nav nav-tabs mb-4" id="main-tabs">
    <li class="nav-item">
      <button class="nav-link active" id="tab-btn-flights" onclick="switchTab('flights')">
        <i class="bi bi-search"></i> Flights
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="tab-btn-bookings" onclick="switchTab('bookings')">
        <i class="bi bi-ticket-perforated"></i> <span id="lbl-bookings">My Bookings</span>
      </button>
    </li>
    <li class="nav-item" id="tab-li-users" style="display:none">
      <button class="nav-link" id="tab-btn-users" onclick="switchTab('users')">
        <i class="bi bi-people"></i> Users
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="tab-btn-profile" onclick="switchTab('profile')">
        <i class="bi bi-person-circle"></i> My Profile
      </button>
    </li>
  </ul>

  <!-- FLIGHTS -->
  <div id="tab-flights">

    <!-- Admin: add flight -->
    <div id="add-flight-panel" style="display:none" class="card p-3 mb-4" style="border-left:4px solid #dc3545">
      <h6 class="mb-3 text-danger"><i class="bi bi-plus-circle"></i> Add Flight</h6>
      <div class="row g-2 mb-2">
        <div class="col-sm-2">
          <label class="form-label small">Flight #</label>
          <input id="af-num" type="text" class="form-control form-control-sm" placeholder="AA123"/>
        </div>
        <div class="col-sm-2">
          <label class="form-label small">Origin</label>
          <input id="af-origin" type="text" class="form-control form-control-sm"/>
        </div>
        <div class="col-sm-2">
          <label class="form-label small">Destination</label>
          <input id="af-dest" type="text" class="form-control form-control-sm"/>
        </div>
        <div class="col-sm-2">
          <label class="form-label small">Departure</label>
          <input id="af-dep" type="datetime-local" class="form-control form-control-sm"/>
        </div>
        <div class="col-sm-2">
          <label class="form-label small">Arrival</label>
          <input id="af-arr" type="datetime-local" class="form-control form-control-sm"/>
        </div>
        <div class="col-sm-1">
          <label class="form-label small">Price $</label>
          <input id="af-price" type="number" class="form-control form-control-sm"/>
        </div>
        <div class="col-sm-1">
          <label class="form-label small">Seats</label>
          <input id="af-seats" type="number" class="form-control form-control-sm" value="150"/>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-danger btn-sm" onclick="addFlight()">
          <i class="bi bi-plus"></i> Add
        </button>
        <span id="af-msg" class="small"></span>
      </div>
    </div>

    <!-- Search bar -->
    <div class="card p-3 mb-4">
      <h5 class="mb-3">Search Flights</h5>
      <div class="row g-2">
        <div class="col-md-3">
          <label class="form-label">From</label>
          <input id="sf-from" type="text" class="form-control" placeholder="City or airport"/>
        </div>
        <div class="col-md-3">
          <label class="form-label">To</label>
          <input id="sf-to" type="text" class="form-control" placeholder="City or airport"/>
        </div>
        <div class="col-md-2">
          <label class="form-label">Date</label>
          <input id="sf-date" type="date" class="form-control"/>
        </div>
        <div class="col-md-2">
          <label class="form-label">Passengers</label>
          <input id="sf-pax" type="number" class="form-control" value="1" min="1"/>
        </div>
        <div class="col-md-2 d-flex align-items-end gap-2">
          <button class="btn btn-primary flex-fill" onclick="searchFlights()">
            <i class="bi bi-search"></i> Search
          </button>
          <button class="btn btn-outline-secondary" onclick="loadFlights()" title="Show all">
            <i class="bi bi-list-ul"></i>
          </button>
        </div>
      </div>
    </div>

    <div id="flights-grid" class="row g-3"></div>
  </div>

  <!-- BOOKINGS -->
  <div id="tab-bookings" style="display:none">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 id="bookings-title" class="mb-0">My Bookings</h5>
      <button class="btn btn-outline-primary btn-sm" onclick="loadBookings()">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
    </div>
    <div id="bookings-list"></div>
  </div>

  <!-- USERS (admin only) -->
  <div id="tab-users" style="display:none">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">All Users</h5>
      <button class="btn btn-outline-secondary btn-sm" onclick="loadUsers()">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
    </div>
    <div id="users-list"></div>
  </div>

  <!-- PROFILE -->
  <div id="tab-profile" style="display:none">
    <div class="row">
      <div class="col-md-5">
        <div class="card p-4">
          <h5 class="mb-3">Edit Profile</h5>
          <div class="mb-2">
            <label class="form-label">First name</label>
            <input id="pf-first" type="text" class="form-control"/>
          </div>
          <div class="mb-2">
            <label class="form-label">Last name</label>
            <input id="pf-last" type="text" class="form-control"/>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input id="pf-phone" type="text" class="form-control"/>
          </div>
          <button class="btn btn-primary" onclick="saveProfile()">
            <i class="bi bi-save"></i> Save changes
          </button>
          <div id="pf-msg" class="mt-2 small"></div>
        </div>
      </div>
      <div class="col-md-5 mt-3 mt-md-0">
        <div class="card p-4">
          <h6 class="text-muted mb-3">Account info</h6>
          <p class="mb-1"><strong>Username:</strong> <span id="pf-username"></span></p>
          <p class="mb-1"><strong>Email:</strong> <span id="pf-email"></span></p>
          <p class="mb-0"><strong>Role:</strong> <span id="pf-role"></span></p>
        </div>
      </div>
    </div>
  </div>

</div><!-- /screen-app -->

<!-- BOOK MODAL -->
<div class="modal fade" id="modal-book" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Book Flight</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p id="mb-info" class="mb-3 fw-semibold"></p>
        <label class="form-label">Number of passengers</label>
        <input id="mb-pax" type="number" class="form-control" value="1" min="1"/>
        <div id="mb-err" class="text-danger small mt-2"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="confirmBooking()">Confirm booking</button>
      </div>
    </div>
  </div>
</div>

<!-- PAY MODAL -->
<div class="modal fade" id="modal-pay" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Pay for Booking</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p id="mp-info" class="mb-3 fw-semibold"></p>
        <label class="form-label">Card number</label>
        <input id="mp-card" type="text" class="form-control" placeholder="4111 1111 1111 1111" maxlength="19"/>
        <div id="mp-err" class="text-danger small mt-2"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-success" onclick="confirmPayment()">
          <i class="bi bi-credit-card"></i> Pay now
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
const API = '/api';
let AUTH = null;
let bookFlightId = null;
let payBookingId = null, payTotal = null;

// ─────────────────────────────────────────────────────────────────────────────
// Bootstrap
// ─────────────────────────────────────────────────────────────────────────────
(function boot() {
  const saved = localStorage.getItem('skybook');
  if (saved) {
    AUTH = JSON.parse(saved);
    const p = new URLSearchParams(location.search);
    showApp();
    // honour tab / pre-filled search coming from dashboard.html
    const tab = p.get('tab');
    if (tab) switchTab(tab);
    if (tab === 'flights' && (p.get('from') || p.get('to') || p.get('date'))) {
      document.getElementById('sf-from').value = p.get('from') || '';
      document.getElementById('sf-to').value   = p.get('to')   || '';
      document.getElementById('sf-date').value  = p.get('date') || '';
      document.getElementById('sf-pax').value   = p.get('pax')  || '1';
      searchFlights();
    }
  } else {
    show('screen-auth');
    hide('screen-app');
    hide('navbar');
  }
})();

// ─────────────────────────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────────────────────────
function show(id) { document.getElementById(id).style.display = ''; }
function hide(id) { document.getElementById(id).style.display = 'none'; }

function authHdr() {
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AUTH.token };
}

function api(path, opts = {}) {
  const o = { method: opts.method || 'GET', headers: authHdr() };
  if (opts.body) o.body = JSON.stringify(opts.body);
  return fetch(API + path, o);
}

function isAdmin() { return AUTH && AUTH.role === 'ADMIN'; }

// ─────────────────────────────────────────────────────────────────────────────
// Auth screen
// ─────────────────────────────────────────────────────────────────────────────
function authTab(tab) {
  if (tab === 'login') {
    show('form-login'); hide('form-reg');
    document.getElementById('btn-login-tab').classList.add('active');
    document.getElementById('btn-reg-tab').classList.remove('active');
  } else {
    hide('form-login'); show('form-reg');
    document.getElementById('btn-login-tab').classList.remove('active');
    document.getElementById('btn-reg-tab').classList.add('active');
  }
}

async function doLogin() {
  document.getElementById('li-err').textContent = '';
  const res = await fetch(API + '/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('li-user').value.trim(),
      password: document.getElementById('li-pass').value
    })
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    document.getElementById('li-err').textContent = e.detail || 'Login failed';
    return;
  }
  AUTH = await res.json();
  localStorage.setItem('skybook', JSON.stringify(AUTH));
  location.href = 'dashboard.html';
}

async function doRegister() {
  document.getElementById('rg-err').textContent = '';
  const res = await fetch(API + '/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username:    document.getElementById('rg-user').value.trim(),
      firstName:   document.getElementById('rg-first').value.trim(),
      lastName:    document.getElementById('rg-last').value.trim(),
      email:       document.getElementById('rg-email').value.trim(),
      phoneNumber: document.getElementById('rg-phone').value.trim(),
      password:    document.getElementById('rg-pass').value
    })
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    document.getElementById('rg-err').textContent = e.detail || 'Registration failed';
    return;
  }
  AUTH = await res.json();
  localStorage.setItem('skybook', JSON.stringify(AUTH));
  location.href = 'dashboard.html';
}

function logout() {
  AUTH = null;
  localStorage.removeItem('skybook');
  location.reload();
}

// ─────────────────────────────────────────────────────────────────────────────
// Show main app
// ─────────────────────────────────────────────────────────────────────────────
function showApp() {
  hide('screen-auth');
  show('screen-app');
  show('navbar');

  // Navbar
  document.getElementById('nav-name').textContent = AUTH.fullName || AUTH.username;
  if (isAdmin()) {
    show('nav-role');
    // Admin extras
    show('add-flight-panel');
    show('tab-li-users');
    document.getElementById('lbl-bookings').textContent = 'All Bookings';
    document.getElementById('bookings-title').textContent = 'All Bookings';
  }

  switchTab('flights');
}

// ─────────────────────────────────────────────────────────────────────────────
// Tab switching
// ─────────────────────────────────────────────────────────────────────────────
const TABS = ['flights', 'bookings', 'users', 'profile'];

function switchTab(name) {
  TABS.forEach(t => {
    const panel = document.getElementById('tab-' + t);
    const btn   = document.getElementById('tab-btn-' + t);
    if (panel) panel.style.display = (t === name) ? '' : 'none';
    if (btn)   btn.classList.toggle('active', t === name);
  });
  if (name === 'bookings') loadBookings();
  if (name === 'users')    loadUsers();
  if (name === 'profile')  loadProfile();
}

// ─────────────────────────────────────────────────────────────────────────────
// Flights
// ─────────────────────────────────────────────────────────────────────────────
async function loadFlights() {
  const res = await api('/flights');
  renderFlights(res.ok ? await res.json() : []);
}

async function searchFlights() {
  const from = document.getElementById('sf-from').value.trim();
  const to   = document.getElementById('sf-to').value.trim();
  const date = document.getElementById('sf-date').value;
  const pax  = document.getElementById('sf-pax').value || 1;
  let url = '/flights/search?passengers=' + pax;
  if (from) url += '&origin=' + encodeURIComponent(from);
  if (to)   url += '&destination=' + encodeURIComponent(to);
  if (date) url += '&date=' + date;
  const res = await api(url);
  renderFlights(res.ok ? await res.json() : []);
}

function renderFlights(list) {
  const grid = document.getElementById('flights-grid');
  if (!Array.isArray(list) || list.length === 0) {
    grid.innerHTML = '<p class="text-muted">No flights found.</p>';
    return;
  }
  grid.innerHTML = list.map(f => `
    <div class="col-md-6 col-lg-4">
      <div class="card flight-card p-3">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <span class="badge bg-primary">${f.flightNumber}</span>
          <span class="fw-bold text-success">$${f.price}</span>
        </div>
        <div class="d-flex justify-content-between mb-1">
          <span class="fw-semibold">${f.origin}</span>
          <i class="bi bi-arrow-right text-muted"></i>
          <span class="fw-semibold">${f.destination}</span>
        </div>
        <div class="text-muted small mb-1">
          <i class="bi bi-clock"></i> ${fmtDt(f.departureTime)} → ${fmtDt(f.arrivalTime)}
        </div>
        <div class="text-muted small mb-3">
          <i class="bi bi-people"></i> ${f.availableSeats} seats available
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-primary btn-sm flex-fill"
            onclick="openBookModal(${f.id}, '${f.flightNumber}', '${f.origin}', '${f.destination}', ${f.price})"
            ${f.availableSeats < 1 ? 'disabled' : ''}>
            ${f.availableSeats < 1 ? 'Fully booked' : '<i class="bi bi-ticket-perforated"></i> Book'}
          </button>
          ${isAdmin() ? `
          <button class="btn btn-outline-danger btn-sm" onclick="deleteFlight(${f.id}, '${f.flightNumber}')" title="Delete flight">
            <i class="bi bi-trash"></i>
          </button>` : ''}
        </div>
      </div>
    </div>`).join('');
}

async function addFlight() {
  const body = {
    flightNumber:  document.getElementById('af-num').value.trim(),
    origin:        document.getElementById('af-origin').value.trim(),
    destination:   document.getElementById('af-dest').value.trim(),
    departureTime: document.getElementById('af-dep').value,
    arrivalTime:   document.getElementById('af-arr').value,
    price:         parseFloat(document.getElementById('af-price').value),
    totalSeats:    parseInt(document.getElementById('af-seats').value),
  };
  const res = await api('/flights', { method: 'POST', body });
  const msg = document.getElementById('af-msg');
  if (res.ok) {
    msg.className = 'text-success small';
    msg.textContent = 'Flight added!';
    loadFlights();
  } else {
    const e = await res.json().catch(() => ({}));
    msg.className = 'text-danger small';
    msg.textContent = e.detail || 'Failed to add flight';
  }
}

async function deleteFlight(id, num) {
  if (!confirm('Delete flight ' + num + '?')) return;
  const res = await api('/flights/' + id, { method: 'DELETE' });
  if (res.ok || res.status === 204) { toast('Flight deleted', 'success'); loadFlights(); }
  else toast('Delete failed', 'danger');
}

// ─────────────────────────────────────────────────────────────────────────────
// Book modal
// ─────────────────────────────────────────────────────────────────────────────
function openBookModal(id, num, from, to, price) {
  bookFlightId = id;
  document.getElementById('mb-info').textContent = num + ': ' + from + ' → ' + to + ' · $' + price + '/seat';
  document.getElementById('mb-pax').value = 1;
  document.getElementById('mb-err').textContent = '';
  new bootstrap.Modal(document.getElementById('modal-book')).show();
}

async function confirmBooking() {
  document.getElementById('mb-err').textContent = '';
  const pax = parseInt(document.getElementById('mb-pax').value);
  const res = await api('/bookings', {
    method: 'POST',
    body: { userId: AUTH.userId, flightId: bookFlightId, numberOfPassengers: pax }
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    document.getElementById('mb-err').textContent = e.detail || 'Booking failed';
    return;
  }
  bootstrap.Modal.getInstance(document.getElementById('modal-book')).hide();
  toast('Booking created! Go to Bookings to pay.', 'success');
  loadFlights();
}

// ─────────────────────────────────────────────────────────────────────────────
// Bookings
// ─────────────────────────────────────────────────────────────────────────────
async function loadBookings() {
  const url = isAdmin() ? '/bookings' : '/bookings/user/' + AUTH.userId;
  const res = await api(url);
  renderBookings(res.ok ? await res.json() : []);
}

function renderBookings(list) {
  const el = document.getElementById('bookings-list');
  if (!Array.isArray(list) || list.length === 0) {
    el.innerHTML = '<p class="text-muted">No bookings found.</p>';
    return;
  }
  el.innerHTML = list.map(b => `
    <div class="card mb-3 p-3">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          ${isAdmin() && b.userFullName ? `<div class="text-muted small mb-1"><i class="bi bi-person"></i> ${b.userFullName}</div>` : ''}
          <span class="fw-semibold">${b.flightNumber || 'Flight #' + b.flightId}</span>
          ${b.origin ? ' · ' + b.origin + ' → ' + b.destination : ''}
          <div class="text-muted small">${fmtDt(b.departureTime)}</div>
          <div class="small mt-1">
            Passengers: ${b.numberOfPassengers} &nbsp;·&nbsp; Total: <strong>$${b.totalPrice}</strong>
          </div>
        </div>
        <span class="badge bg-${statusColor(b.status)}">${b.status}</span>
      </div>
      <div class="mt-2 d-flex gap-2 flex-wrap">
        ${b.status === 'PENDING' ? `
          <button class="btn btn-success btn-sm" onclick="openPayModal(${b.id}, ${b.totalPrice})">
            <i class="bi bi-credit-card"></i> Pay
          </button>` : ''}
        ${b.status === 'PENDING' || b.status === 'CONFIRMED' ? `
          <button class="btn btn-outline-danger btn-sm" onclick="cancelBooking(${b.id})">
            <i class="bi bi-x-circle"></i> Cancel
          </button>` : ''}
        ${b.status === 'CONFIRMED' ? `
          <button class="btn btn-outline-secondary btn-sm" onclick="viewPayment(${b.id})">
            <i class="bi bi-receipt"></i> View payment
          </button>` : ''}
        ${isAdmin() && b.status === 'CONFIRMED' ? `
          <button class="btn btn-warning btn-sm" onclick="refundBooking(${b.id})">
            <i class="bi bi-arrow-counterclockwise"></i> Refund
          </button>` : ''}
      </div>
    </div>`).join('');
}

async function cancelBooking(id) {
  if (!confirm('Cancel this booking?')) return;
  const res = await api('/bookings/' + id + '/cancel', { method: 'PUT' });
  if (res.ok) { toast('Booking cancelled', 'info'); loadBookings(); }
  else toast('Cancel failed', 'danger');
}

async function viewPayment(bookingId) {
  const res = await api('/payments/booking/' + bookingId);
  if (!res.ok) { toast('No payment found', 'warning'); return; }
  const p = await res.json();
  toast('Payment ' + p.status + ' · $' + p.amount + ' · Tx: ' + p.transactionId, 'info');
}

async function refundBooking(bookingId) {
  const pRes = await api('/payments/booking/' + bookingId);
  if (!pRes.ok) { toast('No payment found', 'warning'); return; }
  const payment = await pRes.json();
  if (!confirm('Refund $' + payment.amount + ' for booking #' + bookingId + '?')) return;
  const res = await api('/payments/' + payment.id + '/refund', { method: 'PUT' });
  if (res.ok) { toast('Refund processed', 'success'); loadBookings(); }
  else toast('Refund failed', 'danger');
}

// ─────────────────────────────────────────────────────────────────────────────
// Pay modal
// ─────────────────────────────────────────────────────────────────────────────
function openPayModal(id, total) {
  payBookingId = id;
  payTotal = total;
  document.getElementById('mp-info').textContent = 'Booking #' + id + ' · Total: $' + total;
  document.getElementById('mp-card').value = '';
  document.getElementById('mp-err').textContent = '';
  new bootstrap.Modal(document.getElementById('modal-pay')).show();
}

async function confirmPayment() {
  const card = document.getElementById('mp-card').value.replace(/\s/g, '');
  document.getElementById('mp-err').textContent = '';
  if (card.length < 13) {
    document.getElementById('mp-err').textContent = 'Enter a valid card number';
    return;
  }
  const res = await api('/payments', {
    method: 'POST',
    body: { bookingId: payBookingId, amount: payTotal, cardNumber: card }
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    document.getElementById('mp-err').textContent = e.detail || 'Payment failed';
    return;
  }
  bootstrap.Modal.getInstance(document.getElementById('modal-pay')).hide();
  toast('Payment successful!', 'success');
  loadBookings();
}

// ─────────────────────────────────────────────────────────────────────────────
// Users (admin only)
// ─────────────────────────────────────────────────────────────────────────────
async function loadUsers() {
  if (!isAdmin()) return;
  const res = await api('/users');
  renderUsers(res.ok ? await res.json() : []);
}

function renderUsers(list) {
  const el = document.getElementById('users-list');
  if (!Array.isArray(list) || list.length === 0) {
    el.innerHTML = '<p class="text-muted">No users found.</p>';
    return;
  }
  el.innerHTML = `
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr><th>ID</th><th>Username</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th></th></tr>
        </thead>
        <tbody>
          ${list.map(u => `
          <tr>
            <td>${u.id}</td>
            <td>${u.username}</td>
            <td>${u.firstName} ${u.lastName}</td>
            <td>${u.email}</td>
            <td>${u.phoneNumber || '—'}</td>
            <td><span class="badge ${u.role === 'ADMIN' ? 'bg-danger' : 'bg-secondary'}">${u.role}</span></td>
            <td>${u.role !== 'ADMIN' ? `
              <button class="btn btn-outline-danger btn-sm" onclick="deleteUser(${u.id}, '${u.username}')">
                <i class="bi bi-trash"></i>
              </button>` : '—'}
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

async function deleteUser(id, username) {
  if (!confirm('Delete user "' + username + '" and all their bookings/payments?')) return;
  const res = await api('/users/' + id, { method: 'DELETE' });
  if (res.ok || res.status === 204) { toast('User deleted', 'success'); loadUsers(); }
  else {
    const e = await res.json().catch(() => ({}));
    toast(e.detail || 'Delete failed', 'danger');
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Profile
// ─────────────────────────────────────────────────────────────────────────────
async function loadProfile() {
  const res = await api('/auth/me');
  if (!res.ok) return;
  const u = await res.json();
  document.getElementById('pf-first').value    = u.firstName || '';
  document.getElementById('pf-last').value     = u.lastName  || '';
  document.getElementById('pf-phone').value    = u.phoneNumber || '';
  document.getElementById('pf-username').textContent = u.username;
  document.getElementById('pf-email').textContent    = u.email;
  document.getElementById('pf-role').innerHTML =
    `<span class="badge ${u.role === 'ADMIN' ? 'bg-danger' : 'bg-secondary'}">${u.role}</span>`;
}

async function saveProfile() {
  const res = await api('/auth/profile', {
    method: 'PUT',
    body: {
      firstName:   document.getElementById('pf-first').value.trim(),
      lastName:    document.getElementById('pf-last').value.trim(),
      phoneNumber: document.getElementById('pf-phone').value.trim(),
    }
  });
  const msg = document.getElementById('pf-msg');
  if (res.ok) {
    const u = await res.json();
    AUTH.fullName = u.firstName + ' ' + u.lastName;
    localStorage.setItem('skybook', JSON.stringify(AUTH));
    document.getElementById('nav-name').textContent = AUTH.fullName;
    msg.className = 'text-success small';
    msg.textContent = 'Profile updated!';
  } else {
    msg.className = 'text-danger small';
    msg.textContent = 'Update failed';
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────────────────────────────────────
function statusColor(s) {
  return { CONFIRMED: 'success', PENDING: 'warning', CANCELLED: 'danger' }[s] || 'secondary';
}

function fmtDt(s) {
  if (!s) return '';
  return new Date(s).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function toast(msg, type) {
  const colors = { success: 'bg-success', danger: 'bg-danger', warning: 'bg-warning text-dark', info: 'bg-info text-dark' };
  const id = 'toast-' + Date.now();
  const div = document.createElement('div');
  div.id = id;
  div.className = 'toast align-items-center text-white border-0 show mb-2 ' + (colors[type] || 'bg-secondary');
  div.setAttribute('role', 'alert');
  div.innerHTML = `<div class="d-flex">
    <div class="toast-body">${msg}</div>
    <button class="btn-close btn-close-white me-2 m-auto" onclick="document.getElementById('${id}').remove()"></button>
  </div>`;
  document.getElementById('toast-container').appendChild(div);
  setTimeout(() => div.remove(), 4000);
}
</script>
